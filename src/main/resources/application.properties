spring.application.name=library-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/library_db?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=false&connectionTimeZone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
server.error.include-message=never
server.error.include-stacktrace=never
springdoc.swagger-ui.path=/swagger-ui.html
